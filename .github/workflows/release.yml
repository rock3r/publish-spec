name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish a release for a new version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Release the SKILL.md version if it has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -e "import('./scripts/changelog.mjs').then(m => console.log(m.skillVersion()))")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released."
            exit 0
          fi
          node scripts/changelog.mjs "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "publish-spec $version" --notes-file "$RUNNER_TEMP/notes.md"
